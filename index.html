<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InstaPreview · Pré-visualize perfis do Instagram</title>
    <meta
      name="description"
      content="Monte bio, destaques e grid e veja como o perfil do Instagram vai ficar antes de publicar."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="InstaPreview" />
    <meta
      property="og:description"
      content="Veja como o perfil do Instagram vai ficar antes de publicar."
    />
    <script>
      // Applies the saved theme before the first paint, so dark mode doesn't flash white.
      try {
        const saved = localStorage.getItem("instapreview:theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
