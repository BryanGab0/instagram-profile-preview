name: Feature request
description: Suggest an idea for InstaPreview
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, for example "I need to show a client how the feed will look and…".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How do you imagine it working?
